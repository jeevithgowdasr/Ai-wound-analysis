services:
  - type: web
    name: ai-wound-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && pip install -e .
    startCommand: gunicorn backend.app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 10000

  - type: static
    name: ai-wound-frontend
    env: static
    root: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-wound-backend.onrender.com # Change this to your backend URL once deployed
